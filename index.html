<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    background: #050505;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

/* =========================
   NAVIGATION
========================= */

nav {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;

    padding: 32px 42px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    z-index: 1000;
}

.logo {
    font-size: 23px;
    font-weight: 900;
    letter-spacing: 4px;
}

.menu-button {
    background: none;
    border: none;

    color: white;

    cursor: pointer;

    font-size: 11px;

    letter-spacing: 4px;

    text-transform: uppercase;
}

.menu-button:hover {
    opacity: .55;
}

/* =========================
   MENU PANEL
========================= */

.menu-panel {
    position: fixed;

    top: 0;
    right: -100%;

    width: min(470px, 100%);
    height: 100vh;

    background: #080808;

    z-index: 2000;

    padding: 35px;

    border-left: 1px solid #222;

    transition: right .45s ease;
}

.menu-panel.open {
    right: 0;
}

.menu-top {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 100px;
}

.menu-title {
    font-size: 10px;
    letter-spacing: 4px;
    opacity: .45;
}

.close-button {
    background: none;
    border: none;

    color: white;

    font-size: 32px;

    cursor: pointer;
}

.menu-links {
    list-style: none;
}

.menu-links li {
    margin-bottom: 28px;
}

.menu-links a {
    color: white;

    text-decoration: none;

    font-size: 52px;

    font-weight: 600;

    letter-spacing: -2px;

    transition: opacity .25s;
}

.menu-links a:hover {
    opacity: .4;
}

/* =========================
   HERO
========================= */

.hero {
    height: 100vh;
    min-height: 700px;

    display: flex;

    align-items: center;
    justify-content: center;

    text-align: center;

    position: relative;

    overflow: hidden;

    background:
        radial-gradient(
            ellipse at center,
            #252525 0%,
            #111 40%,
            #050505 78%
        );
}

/* subtle cinematic vignette */

.hero::after {
    content: "";

    position: absolute;

    inset: 0;

    background:
        radial-gradient(
            ellipse at center,
            transparent 25%,
            rgba(0,0,0,.75) 100%
        );

    pointer-events: none;
}

.hero-content {
    position: relative;

    z-index: 2;

    width: 100%;
}

/* =========================
   FSB SCRIPT
========================= */

.hero-small {
    font-size: 9px;

    letter-spacing: 7px;

    opacity: .45;

    margin-bottom: 42px;

    text-transform: uppercase;
}

.script-logo {
    font-family:
        "Brush Script MT",
        "Segoe Script",
        "Lucida Handwriting",
        cursive;

    font-style: italic;

    font-weight: 400;

    color: #fff;

    line-height: .72;

    letter-spacing: -5px;

    text-shadow:
        0 0 20px rgba(255,255,255,.05);
}

/* FLY SINCE */

.script-top {
    font-size: clamp(75px, 12vw, 175px);

    white-space: nowrap;

    margin-left: -15px;
}

/* BIRTH */

.script-bottom {
    font-size: clamp(95px, 15vw, 210px);

    margin-top: 12px;

    text-align: center;

    transform: translateX(0);

    position: relative;

    left: 0;
}

/* =========================
   TAGLINE
========================= */

.hero-subtitle {
    margin-top: 52px;

    font-size: 11px;

    letter-spacing: 6px;

    opacity: .7;
}

/* =========================
   BUTTON
========================= */

.hero-button {
    display: inline-block;

    margin-top: 42px;

    padding: 15px 42px;

    border: 1px solid rgba(255,255,255,.7);

    color: white;

    text-decoration: none;

    font-size: 10px;

    letter-spacing: 4px;

    transition: all .3s ease;
}

.hero-button:hover {
    background: white;

    color: black;
}

/* =========================
   SECTIONS
========================= */

section {
    padding: 130px 8%;
}

.section-title {
    font-size: 10px;

    letter-spacing: 5px;

    margin-bottom: 55px;

    opacity: .45;

    text-transform: uppercase;
}

/* =========================
   PROJECT FSB
========================= */

.project {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 65px;

    align-items: center;
}

.project-text h2 {
    font-size: clamp(55px, 7vw, 105px);

    line-height: .82;

    font-weight: 900;

    letter-spacing: -5px;

    margin-bottom: 30px;
}

.project-text p {
    max-width: 470px;

    color: #999;

    line-height: 1.8;

    font-size: 14px;
}

.project-image {
    height: 520px;

    background:
        radial-gradient(
            circle at center,
            #303030,
            #121212 65%,
            #050505
        );

    border: 1px solid #202020;
}

/* =========================
   CARDS
========================= */

.cards {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 18px;
}

.card {
    height: 390px;

    background:
        linear-gradient(
            145deg,
            #202020,
            #0d0d0d
        );

    border: 1px solid #202020;

    display: flex;

    align-items: flex-end;

    padding: 30px;

    transition:
        transform .35s ease,
        background .35s ease;
}

.card:hover {
    transform: translateY(-8px);

    background: #191919;
}

.card h3 {
    font-size: 30px;

    margin-bottom: 8px;
}

.card p {
    font-size: 10px;

    letter-spacing: 3px;

    color: #777;
}

/* =========================
   EVENTS
========================= */

.events {
    border-top: 1px solid #202020;

    border-bottom: 1px solid #202020;
}

.events h2 {
    font-size: clamp(55px, 8vw, 115px);

    line-height: .82;

    letter-spacing: -5px;

    margin-bottom: 30px;
}

.events p {
    color: #888;

    max-width: 500px;

    line-height: 1.8;
}

/* =========================
   FOOTER
========================= */

footer {
    padding: 45px 8%;

    display: flex;

    justify-content: space-between;

    color: #555;

    font-size: 10px;

    letter-spacing: 3px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 800px) {

    nav {
        padding: 24px;
    }

    .hero {
        min-height: 650px;
    }

    .hero-small {
        letter-spacing: 4px;
    }

    .script-top {
        font-size: 68px;
    }

    .script-bottom {
        font-size: 92px;

        margin-top: 8px;
    }

    .hero-subtitle {
        font-size: 8px;

        letter-spacing: 3px;
    }

    .project {
        grid-template-columns: 1fr;
    }

    .project-image {
        height: 350px;
    }

    .cards {
        grid-template-columns: 1fr;
    }

    .card {
        height: 320px;
    }

    .menu-panel {
        width: 100%;
    }

    .menu-links a {
        font-size: 42px;
    }

    footer {
        flex-direction: column;

        gap: 20px;
    }
}
</style>
