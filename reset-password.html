<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset FSB Admin Password</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at top,#191919,#050505 65%);color:#fff;font-family:Arial,Helvetica,sans-serif}.card{width:min(440px,100%);padding:32px;background:#090909;border:1px solid #333;box-shadow:0 20px 80px #000}.kicker{font-size:10px;letter-spacing:4px;color:#aaa;margin-bottom:12px}h1{font-size:28px;letter-spacing:-1px;margin:0 0 10px}p{font-size:13px;line-height:1.6;color:#999;margin-bottom:22px}label{display:block;color:#aaa;font-size:10px;letter-spacing:2px;margin:16px 0 8px}input{width:100%;padding:14px;background:#050505;border:1px solid #333;color:#fff;font-size:14px}button{width:100%;padding:14px;margin-top:18px;background:#fff;color:#000;border:1px solid #fff;font-size:10px;font-weight:700;letter-spacing:2px;cursor:pointer}.status{margin-top:14px;font-size:12px;line-height:1.5;color:#e9b7b7;overflow-wrap:anywhere}a{color:#fff}
</style>  <link rel="icon" type="image/png" href="fsb-favicon.png?v=2">
</head><body><main class="card"><div class="kicker">FLY SINCE BIRTH</div><h1>Reset Password</h1><p>Choose a new password for your FSB admin account.</p>
<form id="resetForm"><label for="newPassword">NEW PASSWORD</label><input id="newPassword" type="password" autocomplete="new-password" minlength="8" required><label for="confirmPassword">CONFIRM NEW PASSWORD</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required><button id="saveButton" type="submit">UPDATE PASSWORD</button><div id="status" class="status" role="status">Verifying your recovery link…</div></form>
<p><a href="/FlySinceBirth/admin.html">Return to FSB Admin sign in</a></p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient("https://ccvhvxugoebdqwxxankl.supabase.co","sb_publishable_vXhQFYGVd6hOHsX4i-ePnw_y687N16Z");
const statusEl=document.getElementById('status'),form=document.getElementById('resetForm'),save=document.getElementById('saveButton');
let recoveryReady=false;
function status(t,ok=false){statusEl.textContent=t;statusEl.style.color=ok?'#a9d9ad':'#e9b7b7'}
(async()=>{try{
 const params=new URLSearchParams(location.search),hp=new URLSearchParams((location.hash||'').slice(1));
 const code=params.get('code');
 const tokenHash=params.get('token_hash')||hp.get('token_hash');
 const type=params.get('type')||hp.get('type');
 if(code){const r=await sb.auth.exchangeCodeForSession(code);if(r.error)throw r.error;recoveryReady=true}
 else if(tokenHash&&type==='recovery'){const r=await sb.auth.verifyOtp({type:'recovery',token_hash:tokenHash});if(r.error)throw r.error;recoveryReady=true}
 else if(hp.get('access_token')&&hp.get('refresh_token')){const r=await sb.auth.setSession({access_token:hp.get('access_token'),refresh_token:hp.get('refresh_token')});if(r.error)throw r.error;recoveryReady=true}
 else{const s=await sb.auth.getSession();if(s.error)throw s.error;recoveryReady=!!s.data.session}
 if(!recoveryReady)throw new Error('This page opened without a recovery token. The email link may be expired, or Supabase is redirecting it to the wrong URL.');
 history.replaceState(null,'',location.pathname);
 status('Recovery link verified. Set your new password below.',true)
}catch(e){recoveryReady=false;status((e.message||'Could not verify recovery link.')+' Do not use the plain page link by itself; it needs the recovery email token.')}})();
form.addEventListener('submit',async e=>{e.preventDefault();const a=document.getElementById('newPassword').value,b=document.getElementById('confirmPassword').value;if(!recoveryReady){status('The recovery email link has not been verified. Open the reset page using the link from the email.');return}if(a.length<8){status('Use at least 8 characters.');return}if(a!==b){status('The passwords do not match.');return}save.disabled=true;save.textContent='UPDATING…';try{const r=await sb.auth.updateUser({password:a});if(r.error)throw r.error;status('Password updated. You can now sign in to FSB Admin.',true);form.reset();recoveryReady=false}catch(e){status(e.message||'Could not update password.')}finally{save.disabled=false;save.textContent='UPDATE PASSWORD'}});
</script></body></html>
