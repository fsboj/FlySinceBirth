<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Artists | Fly Since Birth</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #050505;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
}

.navbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;

    padding: 25px 45px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    z-index: 1000;

    background: rgba(5,5,5,0.45);
    backdrop-filter: blur(10px);
}

.nav-logo img {
    width: 55px;
    height: 55px;
    object-fit: contain;
}

.page {
    padding: 150px 7% 80px;
}

.page-label {
    color: #777;
    font-size: 9px;
    letter-spacing: 5px;
    margin-bottom: 20px;
}

.page-heading {
    font-size: clamp(55px, 9vw, 125px);
    line-height: 0.82;
    letter-spacing: -6px;
    font-weight: 800;
}

.artists-layout {
    margin-top: 55px;
    display: grid;
    grid-template-columns: minmax(190px, 240px) minmax(0, 1fr);
    gap: 34px;
    align-items: start;
}

.artist-directory {
    border: 1px solid #242424;
    background: #090909;
    padding: 22px;
    position: sticky;
    top: 110px;
    max-height: calc(100vh - 130px);
    overflow-y: auto;
}

.artist-directory h2 {
    color: #888;
    font-size: 10px;
    letter-spacing: 3px;
    margin-bottom: 18px;
}

.artist-search { width:100%; min-height:42px; margin:0 0 14px; padding:0 11px; border:1px solid #333; background:#111; color:#fff; font:inherit; font-size:12px; }
.artist-search:focus { outline:2px solid #aaa; outline-offset:2px; }
.directory-empty { padding:10px; color:#888; font-size:12px; line-height:1.6; }
.directory-empty button { display:block; margin:14px 0 0; padding:10px 13px; border:1px solid #555; background:transparent; color:#fff; cursor:pointer; font-size:10px; letter-spacing:1.5px; }

.artist-directory-list {
    list-style: none;
    display: grid;
    gap: 4px;
}

.artist-directory-list a {
    display: block;
    padding: 9px 10px;
    color: #eee;
    font-size: 13px;
    text-decoration: none;
    border-bottom: 1px solid #1c1c1c;
    transition: background 0.2s, color 0.2s;
}

.artist-directory-list a:hover {
    color: #fff;
    background: #171717;
}

.artist-grid {
    margin-top: 0;
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 16px;
}

.artist-card {
    display: block;

    color: white;
    text-decoration: none;

    border: 1px solid #242424;

    background: #090909;

    overflow: hidden;

    transition: 0.3s;
}

.artist-card:hover {
    transform: translateY(-5px);
    background: #111;
}

.artist-image {
    width: 100%;
    aspect-ratio: 1 / 1;
    height: auto;
    object-fit: cover;
    display: block;
    background: #111;
}

.artist-name {
    padding: 20px;

    font-size: 18px;
    font-weight: 700;

    letter-spacing: 1px;
}

.empty-state {
    color: #555;

    font-size: 9px;
    letter-spacing: 3px;
}
.menu-button {
    position: fixed;
    top: 25px;
    right: 45px;
    z-index: 2000;
    background: none;
    border: none;
    color: white;
    cursor: pointer;
    display: flex;
    align-items: center;
    padding: 5px;
}
.menu-lines {
    width: 23px;
}

.menu-lines span {
    display: block;
    height: 1px;
    background: white;
    margin: 5px 0;
}

/* SIDE MENU */
.menu {
    position: fixed;
    top: 0;
    right: -100%;
    width: 440px;
    max-width: 100%;
    height: 100vh;
    background: #090909;
    border-left: 1px solid #242424;
    z-index: 3000;
    padding: 35px;
    transition: right 0.45s ease;
}

.menu.open {
    right: 0;
}

.menu-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 90px;
}

.menu-small img {
    width: 360px;
    max-width: 100%;
    height: auto;
    display: block;
    object-fit: contain;
    transform: translateX(-30px);
}

.close-menu {
    background: none;
    border: none;
    color: white;
    font-size: 32px;
    cursor: pointer;
}

.menu ul {
    list-style: none;
}

.menu li {
    margin-bottom: 28px;
}

.menu a {
    color: white;
    text-decoration: none;
    font-size: 48px;
    font-weight: 700;
    letter-spacing: -2px;
    transition: opacity 0.25s;
}

.menu a:hover {
    opacity: 0.4;
}
@media (max-width: 800px) {
.menu-button {
    top: 20px;
    right: 20px;
}
    .navbar {
        padding: 20px;
    }

    .page {
        padding: 130px 25px 60px;
    }

    .artists-layout {
        grid-template-columns: 1fr;
        gap: 18px;
        margin-top: 35px;
    }

    .artist-directory {
        position: static;
        max-height: 240px;
        padding: 16px;
    }

    .artist-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        margin-top: 40px;
    }

    .artist-image {
        aspect-ratio: 1 / 1;
        height: auto;
    }

    .artist-name {
        padding: 12px;
        font-size: 14px;
    }

}

</style>

</head>


<body>


<header class="public-nav"><a class="nav-logo" href="index.html" aria-label="Fly Since Birth home"><img src="fsblogo.PNG" alt="FSB"></a><nav class="public-nav-links" aria-label="Main navigation"><a id="topnavHome" href="index.html">Home</a><a id="topnavMusic" href="music.html">My FSB</a><a id="topnavArtist" href="artists.html">Artist</a><a id="topnavShop" href="merch.html">Shop</a><a id="topnavVideos" href="videos.html">Videos</a><a id="topnavEvents" href="events.html">Events</a><a id="topnavAccount" href="account.html">Account</a></nav></header>

<main class="page">

    <div class="page-label">
        FLY SINCE BIRTH
    </div>

    <h1 class="page-heading">
        ARTISTS
    </h1>


    <div class="artists-layout">
        <aside class="artist-directory" aria-label="Artists in alphabetical order">
            <h2>ALL ARTISTS</h2>
            <input id="artistSearch" class="artist-search" type="search" placeholder="Find an artist" aria-label="Search artists">
            <ul id="artistDirectoryList" class="artist-directory-list">
                <li class="empty-state">LOADING ARTISTS</li>
            </ul>
        </aside>
        <section aria-label="Artist profiles">
            <div
                id="artistGrid"
                class="artist-grid"
            >
                <div class="empty-state">
                    LOADING ARTISTS
                </div>
            </div>
        </section>
    </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
    "https://ccvhvxugoebdqwxxankl.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_vXhQFYGVd6hOHsX4i-ePnw_y687N16Z";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


let allArtists = [];

function renderArtistResults() {
    const grid = document.getElementById("artistGrid");
    const directory = document.getElementById("artistDirectoryList");
    const query = document.getElementById("artistSearch").value.trim().toLocaleLowerCase();
    const results = allArtists.filter(artist => String(artist.name || "").toLocaleLowerCase().includes(query));
    grid.replaceChildren();
    directory.replaceChildren();
    if (!results.length) {
        const message = query ? "NO ARTISTS MATCH THAT SEARCH" : "NO ARTISTS AVAILABLE";
        grid.innerHTML = '<div class="empty-state directory-empty">' + message + '</div>';
        directory.innerHTML = '<li class="directory-empty">' + message + '</li>';
        return;
    }
    results.forEach(function(artist) {
        const directoryItem = document.createElement("li");
        const directoryLink = document.createElement("a");
        directoryLink.href = "artist.html?id=" + encodeURIComponent(artist.id);
        directoryLink.textContent = artist.name || "ARTIST";
        directoryItem.appendChild(directoryLink);
        directory.appendChild(directoryItem);

        const card = document.createElement("a");
        card.className = "artist-card";
        card.href = "artist.html?id=" + encodeURIComponent(artist.id);
        const image = document.createElement("img");
        image.className = "artist-image";
        image.src = artist.image || "fsblogo.PNG";
        image.alt = (artist.name || "Artist") + " profile";
        image.loading = "lazy";
        image.onerror = function() { image.onerror = null; image.src = "fsblogo.PNG"; };
        const name = document.createElement("div");
        name.className = "artist-name";
        name.textContent = artist.name || "ARTIST";
        card.append(image, name);
        grid.appendChild(card);
    });
}

async function loadArtists() {

    const grid =
        document.getElementById("artistGrid");
    const directory =
        document.getElementById("artistDirectoryList");

    const { data, error } =
        await supabaseClient
            .from("artists")
            .select("*")
            .order(
                "name",
                {
                    ascending: true
                }
            );


    if (error) {

        console.error(
            "Could not load artists:",
            error
        );

        grid.innerHTML = '<div class="empty-state directory-empty">COULD NOT LOAD ARTISTS. <button type="button" class="outline-button" id="retryArtists">RETRY</button></div>';
        directory.innerHTML = '<li class="directory-empty">Could not load artists.</li>';
        document.getElementById("retryArtists")?.addEventListener("click", loadArtists);

        return;
    }


    if (!data || data.length === 0) {

        grid.innerHTML =
            '<div class="empty-state">NO ARTISTS AVAILABLE</div>';
        directory.innerHTML =
            '<li class="empty-state">NO ARTISTS AVAILABLE</li>';

        return;
    }


    data.sort(function(a, b) {
        return String(a.name || "").localeCompare(String(b.name || ""), undefined, { sensitivity: "base" });
    });
    allArtists = data;
    renderArtistResults();

}

document.getElementById("artistSearch").addEventListener("input", renderArtistResults);
loadArtists().catch(function(error) {
    console.error("Could not start artist directory:", error);
    document.getElementById("artistGrid").innerHTML = '<div class="empty-state directory-empty">COULD NOT LOAD ARTISTS. <button type="button" class="outline-button" id="retryArtists">RETRY</button></div>';
    document.getElementById("retryArtists")?.addEventListener("click", loadArtists);
});

</script>

<script src="shared-nav.js?v=3"></script>
</body>

</html>
