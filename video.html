*{box-sizing:border-box;margin:0;padding:0}body{background:#050505;color:#fff;font-family:Arial,Helvetica,sans-serif;min-height:100vh}a{color:inherit;text-decoration:none}.navbar{position:sticky;top:0;z-index:10;background:rgba(5,5,5,.92);backdrop-filter:blur(10px);display:flex;justify-content:space-between;align-items:center;padding:20px 6%;border-bottom:1px solid #202020}.nav-logo img{width:52px;height:52px;object-fit:contain}.back-button{border:1px solid #444;padding:12px 18px;font-size:9px;letter-spacing:2px}.back-button:hover{background:#fff;color:#000}.menu-button{background:none;border:0;color:#fff;cursor:pointer;display:flex;align-items:center;padding:5px}.menu-lines{display:block;width:23px}.menu-lines span{display:block;height:1px;background:#fff;margin:5px 0}.menu{position:fixed;top:0;right:-100%;width:440px;max-width:100%;height:100vh;background:#090909;border-left:1px solid #242424;z-index:3000;padding:35px;transition:right .45s ease}.menu.open{right:0}.menu-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:90px}.menu-small img{width:300px;max-width:100%;height:auto;display:block;object-fit:contain;transform:translateX(-20px)}.close-menu{background:none;border:0;color:#fff;font-size:32px;cursor:pointer}.menu ul{list-style:none}.menu li{margin-bottom:28px}.menu a{color:#fff;text-decoration:none;font-size:clamp(32px,5vw,48px);font-weight:700;letter-spacing:-2px;transition:opacity .25s}.menu a:hover{opacity:.4}.page{width:min(1180px,88%);margin:48px auto 80px}.video-player{width:100%;aspect-ratio:16/9;background:#111;border:1px solid #242424;display:block;max-height:75vh}.video-title{font-size:clamp(24px,4vw,42px);font-weight:800;letter-spacing:-1px;margin-top:25px;line-height:1.1}.video-byline{display:flex;align-items:center;flex-wrap:wrap;gap:9px;margin-top:12px;color:#999;font-size:14px}.artist-link{font-size:15px;font-weight:600;color:#fff}.release-link{font-size:13px;color:#999}.artist-link:hover,.release-link:hover{text-decoration:underline;color:#fff}.separator{color:#555}.section-heading{font-size:12px;letter-spacing:4px;color:#888;margin:52px 0 20px}.next-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.next-card{min-width:0;cursor:pointer}.next-card img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#151515;border:1px solid #242424}.next-card:hover img{opacity:.8}.next-title{font-size:14px;font-weight:700;margin-top:10px;line-height:1.35}.next-artist{font-size:11px;color:#777;margin-top:5px}.empty{font-size:10px;letter-spacing:2px;color:#666;padding:20px 0}footer{padding:35px 6%;border-top:1px solid #202020;color:#555;font-size:9px;letter-spacing:3px;display:flex;justify-content:space-between}@media(max-width:700px){.page{width:92%;margin:28px auto 55px}.navbar{padding:14px 4%}.next-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.video-byline{font-size:12px}.artist-link{font-size:13px}footer{flex-direction:column;gap:15px}}
</style>

<body>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabaseClient=supabase.createClient("https://ccvhvxugoebdqwxxankl.supabase.co","sb_publishable_vXhQFYGVd6hOHsX4i-ePnw_y687N16Z");
</script><script src="music-library.js?v=6"></script><script>
const params=new URLSearchParams(location.search);
const videoId=params.get("video_id");
const songId=params.get("song_id");
const releaseId=params.get("release_id");
let currentVideo=null;
let artistVideos=[];
function safeText(value){return value==null?"":String(value)}
function escapeHtml(value){return safeText(value).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function videoPlayer(url,title){
 const host=document.getElementById("playerHost");host.innerHTML="";
 if(!url){host.innerHTML='<div class="empty">VIDEO LINK NOT AVAILABLE</div>';return}
 const isFile=/\.(mp4|webm|ogg|mov)(\?|#|$)/i.test(url);
 if(isFile){const v=document.createElement("video");v.className="video-player";v.controls=true;v.controlsList="nodownload";v.playsInline=true;v.preload="metadata";v.src=url;v.setAttribute("aria-label",title||"Video player");host.appendChild(v);return}
 let embed=url;
 const yt=url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{6,})/i);
 const vm=url.match(/vimeo\.com\/(?:video\/)?(\d+)/i);
 if(yt)embed="https://www.youtube-nocookie.com/embed/"+yt[1];
 else if(vm)embed="https://player.vimeo.com/video/"+vm[1];
 const frame=document.createElement("iframe");frame.className="video-player";frame.src=embed;frame.title=title||"Video player";frame.allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";frame.allowFullscreen=true;frame.referrerPolicy="strict-origin-when-cross-origin";host.appendChild(frame);
}
async function loadPage(){
 if(!videoId&&!songId&&!releaseId){document.getElementById("playerHost").innerHTML='<div class="empty">VIDEO NOT FOUND</div>';return}
 if(releaseId){
  const result=await supabaseClient.from("artist_releases").select("id,title,type,video_url,artist_id,artwork_url").eq("id",releaseId).single();
  if(result.error||!result.data||!result.data.video_url){document.getElementById("playerHost").innerHTML='<div class="empty">VIDEO NOT FOUND</div>';return}
  currentVideo={id:"release-"+result.data.id,release_id:result.data.id,title:result.data.title,link:result.data.video_url,artist_id:result.data.artist_id,image:result.data.artwork_url};
 }else if(songId){
  const result=await supabaseClient.from("artist_songs").select("id,title,video_url,artist_id,external_features").eq("id",songId).single();
  if(result.error||!result.data||!result.data.video_url){document.getElementById("playerHost").innerHTML='<div class="empty">VIDEO NOT FOUND</div>';return}
  currentVideo={id:"song-"+result.data.id,song_id:result.data.id,title:result.data.title,link:result.data.video_url,artist_id:result.data.artist_id,external_features:result.data.external_features||[]};
 }else{
  const result=await supabaseClient.from("videos").select("*").eq("id",videoId).single();
  if(result.error||!result.data){document.getElementById("playerHost").innerHTML='<div class="empty">VIDEO NOT FOUND</div>';return}
  currentVideo=result.data;
 }
 document.title=(currentVideo.title||"Video")+" | Fly Since Birth";
 document.getElementById("videoTitle").textContent=currentVideo.title||"Untitled Video";
 const favoriteType=currentVideo.song_id?"song":"video";
 const favoriteId=currentVideo.song_id||currentVideo.id;
 const favoriteButton=window.fsbCreateVideoFavoriteButton?.(favoriteType,favoriteId,currentVideo.title);
 if(favoriteButton&&!document.getElementById("videoFavoriteHost").querySelector("button")){favoriteButton.setAttribute("aria-label","Favorite video: "+(currentVideo.title||"Untitled Video"));document.getElementById("videoFavoriteHost").appendChild(favoriteButton)}
 videoPlayer(currentVideo.link,currentVideo.title);
 let artist=null,release=null;
 if(currentVideo.artist_id){
  const a=await supabaseClient.from("artists").select("id,name").eq("id",currentVideo.artist_id).maybeSingle();
  artist=a.data;
 }
 if(currentVideo.release_id){
  const r=await supabaseClient.from("artist_releases").select("id,title,type").eq("id",currentVideo.release_id).maybeSingle();
  release=r.data;
 }
 const byline=document.getElementById("videoByline");
 byline.innerHTML="";
 if(artist){const a=document.createElement("a");a.className="artist-link";a.href="artist.html?id="+encodeURIComponent(artist.id);a.textContent=artist.name||"Artist";byline.appendChild(a)}
 const featureTable=currentVideo.song_id?"artist_song_features":"video_artist_features";
 const featureIdColumn=currentVideo.song_id?"song_id":"video_id";
 const featureRecordId=currentVideo.song_id||currentVideo.id;
 const featureResult=featureRecordId?await supabaseClient.from(featureTable).select("artist_id,sort_order").eq(featureIdColumn,featureRecordId).order("sort_order",{ascending:true}):{data:[],error:null};
 const featuredIds=(featureResult.data||[]).map(row=>String(row.artist_id)).filter(id=>!artist||id!==String(artist.id));
 let featureNames={};
 if(featuredIds.length){const namesResult=await supabaseClient.from("artists").select("id,name").in("id",featuredIds);if(!namesResult.error)(namesResult.data||[]).forEach(item=>featureNames[String(item.id)]=item.name||"Artist")}
 let creditCount=artist?1:0;
 featuredIds.forEach(id=>{const link=document.createElement("a");link.className="artist-link";link.href="artist.html?id="+encodeURIComponent(id);link.textContent=featureNames[id]||"Artist";if(creditCount)byline.appendChild(document.createTextNode(creditCount===1?" feat. ":", "));byline.appendChild(link);creditCount++});
 (currentVideo.external_features||[]).forEach(credit=>{if(!credit||!credit.name||!credit.url)return;try{const url=new URL(credit.url);if(!["http:","https:"].includes(url.protocol))return;const link=document.createElement("a");link.className="artist-link";link.href=url.href;link.target="_blank";link.rel="noopener noreferrer";link.textContent=credit.name;if(creditCount)byline.appendChild(document.createTextNode(creditCount===1?" feat. ":", "));byline.appendChild(link);creditCount++}catch(_){}});
 if(artist&&release){const dot=document.createElement("span");dot.className="separator";dot.textContent="·";byline.appendChild(dot)}
 if(release){const a=document.createElement("a");a.className="release-link";a.href="epalbum.html?id="+encodeURIComponent(release.id) + "&v=70a51fd5";a.textContent=release.title||"Release";byline.appendChild(a);}
 // The artist profile is linked in the byline; no separate backArtist element exists.
 await loadNextVideos();
}
async function loadNextVideos(){
 const host=document.getElementById("nextVideos");
 if(!currentVideo||!currentVideo.artist_id){host.innerHTML='<div class="empty">NO OTHER VIDEOS AVAILABLE</div>';return}
 const [videoResult,songResult,releaseResult]=await Promise.all([
  supabaseClient.from("videos").select("id,title,image,link,artist_id").eq("artist_id",currentVideo.artist_id),
  supabaseClient.from("artist_songs").select("id,title,image_url,video_url,artist_id").eq("artist_id",currentVideo.artist_id).not("video_url","is",null),
  supabaseClient.from("artist_releases").select("id,title,artwork_url,video_url,artist_id,type").eq("artist_id",currentVideo.artist_id).not("video_url","is",null)
 ]);
 if(videoResult.error&&songResult.error&&releaseResult.error){host.innerHTML='<div class="empty">COULD NOT LOAD VIDEOS</div>';return}
 const candidates=[
  ...(videoResult.data||[]).map(item=>({...item,itemType:"video",playUrl:item.link,imageUrl:item.image})),
  ...(songResult.data||[]).map(item=>({...item,itemType:"song",playUrl:item.video_url,imageUrl:item.image_url})),
  ...(releaseResult.data||[]).map(item=>({...item,itemType:"release",playUrl:item.video_url,imageUrl:item.artwork_url}))
 ];
 const normalize=value=>{try{const u=new URL(value,location.href);return(u.origin+u.pathname).toLowerCase()}catch(_){return String(value||"").trim().toLowerCase()}};
 const currentUrl=normalize(currentVideo.link),seen=new Set(currentUrl?[currentUrl]:[]);
 const unique=candidates.filter(item=>{
  if(!item.playUrl)return false;
  if(currentVideo.song_id&&item.itemType==="song"&&String(item.id)===String(currentVideo.song_id))return false;
  if(currentVideo.release_id&&item.itemType==="release"&&String(item.id)===String(currentVideo.release_id))return false;
  if(!currentVideo.song_id&&!currentVideo.release_id&&item.itemType==="video"&&String(item.id)===String(params.get("video_id")))return false;
  const url=normalize(item.playUrl);if(!url||seen.has(url))return false;seen.add(url);return true;
 });
 for(let i=unique.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[unique[i],unique[j]]=[unique[j],unique[i]]}
 const picks=unique.slice(0,9);
 host.innerHTML="";
 if(!picks.length){host.innerHTML='<div class="empty">NO OTHER VIDEOS AVAILABLE</div>';return}
 picks.forEach(function(item){
  const card=document.createElement("article");card.className="next-card";card.tabIndex=0;
  const image=document.createElement("img");image.src=item.imageUrl||"fsblogo.PNG";image.alt=item.title||"Video thumbnail";image.loading="lazy";card.appendChild(image);
  const title=document.createElement("div");title.className="next-title";title.textContent=item.title||"Untitled Video";card.appendChild(title);
  const artist=document.createElement("div");artist.className="next-artist";artist.textContent="PLAY NEXT";card.appendChild(artist);
  const param=item.itemType==="song"?"song_id":item.itemType==="release"?"release_id":"video_id";
  function open(){location.href="video.html?"+param+"="+encodeURIComponent(item.id)+"&v=70a51fd5"}
  card.addEventListener("click",open);card.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();open()}});
  host.appendChild(card);
 });
}
loadPage().catch(function(error){
 console.error("Video page load failed:",error);
 const playerHost=document.getElementById("playerHost");
 if(playerHost.querySelector(".video-player")){
  document.getElementById("nextVideos").innerHTML='<div class="empty">MORE VIDEOS COULD NOT BE LOADED</div>';
  return;
 }
 playerHost.innerHTML='<div class="empty">COULD NOT LOAD VIDEO</div>';
});
</script>

</body>
