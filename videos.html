<style>
*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:Arial,Helvetica,sans-serif;min-height:100vh}
a{color:inherit;text-decoration:none}.navbar{display:flex;justify-content:space-between;align-items:center;padding:20px 6%;border-bottom:1px solid #202020;background:rgba(5,5,5,.94)}
.nav-logo img{width:52px;height:52px;object-fit:contain}.back-link{border:1px solid #444;padding:12px 18px;font-size:10px;letter-spacing:2px}
.page{width:min(1180px,88%);margin:55px auto 80px}.heading{font-size:clamp(30px,5vw,52px);letter-spacing:5px;margin:0 0 35px;font-weight:800}
.video-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:30px 18px}
.video-card{min-width:0;cursor:pointer;outline:none}.video-card:focus-visible{outline:1px solid #fff;outline-offset:5px}.video-thumbnail{width:100%;aspect-ratio:16/9;background:#111;overflow:hidden;border:1px solid #242424}.video-thumbnail img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .25s}.video-card:hover .video-thumbnail img{opacity:.75}
.video-artist{margin-top:12px;color:#fff;font-size:13px;font-weight:800;letter-spacing:1px}.video-title{margin-top:5px;font-size:16px;font-weight:700;line-height:1.35}.status{color:#777;font-size:12px;letter-spacing:1px}
.video-actions{display:flex;justify-content:flex-end;margin-top:8px}.video-actions .fsb-video-favorite{width:34px;height:34px;font-size:18px}
footer{padding:35px 6%;border-top:1px solid #202020;color:#555;font-size:9px;letter-spacing:3px;display:flex;justify-content:space-between}
@media(max-width:800px){.video-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 12px}.page{width:92%;margin-top:35px}}
@media(max-width:520px){.video-grid{grid-template-columns:1fr}.navbar{padding:16px 4%}.heading{letter-spacing:3px}}
</style>

<body>
<header class="public-nav"><a class="nav-logo" href="index.html" aria-label="Fly Since Birth home"><img src="fsblogo.PNG" alt="FSB"></a><nav class="public-nav-links" aria-label="Main navigation"><a id="topnavHome" href="index.html">Home</a><a id="topnavMusic" href="my-fsb.html">FSB</a><a id="topnavArtist" href="artists.html">Artists</a><a id="topnavLibrary" href="music.html">Music</a><a id="topnavShop" href="merch.html">Shop</a><a id="topnavVideos" href="videos.html">Videos</a><a id="topnavEvents" href="events.html">Events</a><a id="topnavAccount" href="account.html">Account</a></nav></header>

<h1 class="heading">VIDEOS</h1>
<div class="browse-tools"><button id="playAllVideos" type="button" disabled>PLAY ALL</button><button id="shuffleVideos" type="button" disabled>SHUFFLE</button><button id="toggleVideoTracklist" type="button" aria-expanded="false" aria-controls="videoTracklist">TRACK LIST</button></div><section id="videoTracklist" class="browse-list-panel" hidden aria-labelledby="videoTrackTitle"><h2 id="videoTrackTitle">VIDEO TRACK LIST</h2><p class="browse-list-note">Choose a video to watch through this list. Upcoming videos stay locked.</p><ol id="videoTrackRows" class="browse-track-list"></ol></section><div id="videoGrid" class="video-grid"><p class="status">LOADING VIDEOS...</p></div>
</main>

<script src="video-source.js?v=20261107"></script><script src="release-catalog.js?v=20261108-video-dates"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabaseClient = supabase.createClient("https://ccvhvxugoebdqwxxankl.supabase.co","sb_publishable_vXhQFYGVd6hOHsX4i-ePnw_y687N16Z");
</script><script src="music-library.js?v=20261105-release"></script><script src="video-browse-playback.js?v=20261108-filter"></script><script>
async function loadVideos(){
 const grid=document.getElementById("videoGrid");
 const [videoResult,songVideoResult,releaseVideoResult]=await Promise.all([
  supabaseClient.from("videos").select("*").order("sort_order",{ascending:true}),
  supabaseClient.from("artist_songs").select("id,title,artist_id,release_id,video_url,image_url,created_at,external_features").not("video_url","is",null).order("created_at",{ascending:false}),
  supabaseClient.from("artist_releases").select("id,title,artist_id,video_url,artwork_url,type,created_at").not("video_url","is",null).order("created_at",{ascending:false})
 ]);
 if(videoResult.error)console.error("Could not load videos:",videoResult.error);
 if(songVideoResult.error)console.error("Could not load song videos:",songVideoResult.error);
 if(releaseVideoResult.error)console.error("Could not load album/EP videos:",releaseVideoResult.error);
 const videos=(videoResult.data||[]).filter(v=>v&&v.id!=null);
 const songVideos=(songVideoResult.data||[]).filter(song=>song&&(song.video_url||song.has_video));
 const releaseVideos=(releaseVideoResult.data||[]).filter(release=>release&&(release.video_url||release.has_video));
 if(videoResult.error&&songVideoResult.error&&releaseVideoResult.error){grid.innerHTML='<p class="status">VIDEOS COULD NOT BE LOADED. PLEASE TRY AGAIN LATER.</p>';return;}
 const releasesById=new Map((await window.FSBRelease.catalog()).artist_releases.map(r=>[String(r.id),r]));
 const items=[
  ...videos.map(video=>({...video,itemType:"video",link:video.link,image:video.image})),
  ...songVideos.map(song=>({...song,itemType:"song",link:song.video_url,image:song.image_url})),
 ...releaseVideos.map(release=>({...release,itemType:"release",link:release.video_url,image:release.artwork_url}))
 ];
 if(!items.length){grid.innerHTML='<p class="status">NO VIDEOS AVAILABLE YET.</p>';return;}
 const standaloneVideos=videos.filter(v=>v.id!=null);
 const [featureResult,songFeatureResult]=await Promise.all([
  standaloneVideos.length
   ?supabaseClient.from("video_artist_features").select("video_id,artist_id,sort_order").in("video_id",standaloneVideos.map(v=>v.id)).order("sort_order")
   :Promise.resolve({data:[],error:null}),
  songVideos.length
   ?supabaseClient.from("artist_song_features").select("song_id,artist_id,sort_order").in("song_id",songVideos.map(v=>v.id)).order("sort_order")
   :Promise.resolve({data:[],error:null})
 ]);
 const features=featureResult.error?[]:(featureResult.data||[]);
 const songFeatures=songFeatureResult.error?[]:(songFeatureResult.data||[]);
 const creditsByVideo=new Map(),creditsBySong=new Map();
 features.forEach(row=>{const key=String(row.video_id);if(!creditsByVideo.has(key))creditsByVideo.set(key,[]);creditsByVideo.get(key).push(String(row.artist_id))});
 songFeatures.forEach(row=>{const key=String(row.song_id);if(!creditsBySong.has(key))creditsBySong.set(key,[]);creditsBySong.get(key).push(String(row.artist_id))});
 const allArtistIds=[...new Set([...items.map(v=>v.artist_id),...features.map(row=>row.artist_id),...songFeatures.map(row=>row.artist_id)].filter(Boolean).map(String))],artistNames={};
 if(allArtistIds.length){
  const result=await supabaseClient.from("artists").select("id,name").in("id",allArtistIds);
  if(!result.error)(result.data||[]).forEach(a=>artistNames[String(a.id)]=a.name||"");
 }
 window.FSBVideoBrowse?.setItems(items,artistNames);
 grid.innerHTML="";
 items.forEach(item=>{
  const card=document.createElement("article");card.className="video-card";card.dataset.videoArtist=String(item.artist_id||"");card.dataset.videoKind=item.itemType;card.dataset.fsbVideoFavoriteType=item.itemType;card.dataset.fsbVideoFavoriteId=String(item.id);card.tabIndex=0;card.setAttribute("role","link");card.setAttribute("aria-label","Watch "+(item.title||"video"));
  const thumb=document.createElement("div");thumb.className="video-thumbnail";
  const img=document.createElement("img");img.src=item.image||"fsblogo.PNG";img.alt=(item.title||"Video")+" thumbnail";img.loading="lazy";thumb.appendChild(img);card.appendChild(thumb);
  const artist=document.createElement("div");artist.className="video-artist";
  const artistCredits=item.itemType==="video"
   ?[...new Set([item.artist_id,...(creditsByVideo.get(String(item.id))||[])].filter(Boolean).map(String))]
   :item.itemType==="song"
    ?[...new Set([item.artist_id,...(creditsBySong.get(String(item.id))||[])].filter(Boolean).map(String))]
    :[...new Set([item.artist_id].filter(Boolean).map(String))];
  let creditCount=0;
  artistCredits.forEach(artistId=>{
   const link=document.createElement("a");link.href="artist.html?id="+encodeURIComponent(artistId);link.textContent=artistNames[artistId]||"Artist";
   link.addEventListener("click",event=>event.stopPropagation());
   if(creditCount===1)artist.appendChild(document.createTextNode(" feat. "));else if(creditCount>1)artist.appendChild(document.createTextNode(", "));
   artist.appendChild(link);creditCount++;
  });
  (item.external_features||[]).forEach(credit=>{
   if(!credit||!credit.name||!credit.url)return;
   try{const url=new URL(credit.url);if(!["http:","https:"].includes(url.protocol))return;
    const link=document.createElement("a");link.href=url.href;link.target="_blank";link.rel="noopener noreferrer";link.textContent=credit.name;link.addEventListener("click",event=>event.stopPropagation());
    artist.appendChild(document.createTextNode(creditCount===1?" feat. ":", "));artist.appendChild(link);creditCount++;
   }catch(_){}
  });
  if(!creditCount)artist.textContent=item.artist||"";
  card.appendChild(artist);
  const title=document.createElement("div");title.className="video-title";title.textContent=item.title||"Untitled Video";card.appendChild(title);if(item.locked){const badge=document.createElement("p");badge.className="fsb-upcoming-label";badge.textContent=window.FSBRelease.label(item);card.appendChild(badge);}
  const actions=document.createElement("div");actions.className="video-actions";
  const favorite=window.fsbCreateVideoFavoriteButton?.(item.itemType,item.id,item.title);
  if(favorite){favorite.addEventListener("click",event=>event.stopPropagation());actions.appendChild(favorite);card.appendChild(actions)}
  const project=item.itemType==='release'?item:releasesById.get(String(item.release_id));
  if(project){const album=document.createElement('a');album.className='video-project-link';album.href='epalbum.html?id='+encodeURIComponent(project.id);album.textContent=project.title||'Release';album.style.cssText='display:block;margin-top:8px;color:#aaa;font-size:13px;line-height:1.6';album.addEventListener('click',event=>event.stopPropagation());card.appendChild(album);}
  const open=()=>window.FSBVideoBrowse.open(item);
  card.addEventListener("click",e=>{if(e.target.closest(".video-artist a"))return;open();});
  card.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){if(e.target!==card)return;e.preventDefault();open();}});
  grid.appendChild(card);
 });
}
loadVideos().then(()=>window.FSBVideoLibrary?.refresh()).catch(()=>{document.getElementById("videoGrid").textContent="VIDEOS COULD NOT BE LOADED. PLEASE REFRESH.";});
</script>
