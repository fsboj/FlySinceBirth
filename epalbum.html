<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Release | Fly Since Birth</title>
</head>

<body>

    <div id="releasePage">

        <div id="releaseArtwork">
            <img id="releaseImage" src="" alt="">
        </div>

        <div id="releaseInfo">

            <h1 id="releaseTitle"></h1>

            <p id="releaseType"></p>

            <p id="releaseArtist"></p>

        </div>

        <div id="releaseTracks">

            <h2>TRACKLIST</h2>

            <div id="trackList"></div>

        </div>

    </div>
<script>
const supabaseUrl = "YOUR_SUPABASE_URL";
const supabaseKey = "YOUR_SUPABASE_ANON_KEY";

const supabase = window.supabase.createClient(
    supabaseUrl,
    supabaseKey
);

const params = new URLSearchParams(window.location.search);
const releaseId = params.get("id");

async function loadRelease() {

    if (!releaseId) {
        document.getElementById("releaseTitle").textContent =
            "Release not found";
        return;
    }

    const { data: release, error } = await supabase
        .from("artist_releases")
        .select("*")
        .eq("id", releaseId)
        .single();

    if (error || !release) {
        document.getElementById("releaseTitle").textContent =
            "Release not found";
        return;
    }

    document.getElementById("releaseTitle").textContent =
        release.title || "";

    document.getElementById("releaseType").textContent =
        (release.type || "").toUpperCase();

    document.getElementById("releaseArtist").textContent =
        release.artist_name || "";

    if (release.image_url) {
        const image = document.getElementById("releaseImage");

        image.src = release.image_url;
        image.alt = release.title || "Release artwork";
    }

}

loadRelease();
</script>
    
</body>
</html>
