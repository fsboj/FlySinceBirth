    <style>
    #releaseVideoList {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
}

.release-video {
    border: 1px solid #242424;
    background: #090909;
    overflow: hidden;
    cursor: pointer;
}

.release-video img {
    width: 100%;
    height: 180px;
    object-fit: contain;
    display: block;
}

.release-video-title {
    padding: 12px;
    font-size: 15px;
    font-weight: 600;
}

.release-video-player {
    width: 100%;
    display: block;
}

@media (max-width: 600px) {

    #releaseVideoList {
        grid-template-columns: 1fr;
    }

    .release-video img {
        height: 200px;
    }

}

#releaseBackButton {

}

#releaseBackButton:hover {
    background: #242424;

#releaseArtwork {
    display: flex;

}

#releaseArtwork img {
    width: 400px;
    height: 400px;

    object-fit: contain;
    display: block;
    background: #111;
}
@media (max-width: 600px) {

    #releasePage {
        padding: 30px 15px;
    }

    #releaseArtwork img {
        width: 100%;
        max-width: 350px;
        height: auto;
        aspect-ratio: 1 / 1;

    #releaseTitle {
        font-size: 30px;
    }

}

   #releaseInfo {
    margin-top: 25px;
    text-align: center;
}

#releaseTitle {
    margin: 0;
    font-size: 42px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
}

#releaseType,
#releaseArtist {
    margin: 8px 0 0;
    font-size: 16px;
}

#releaseType {
    font-weight: 600;
    letter-spacing: 2px;
}
#releaseDate {
    margin: 8px 0 0;
    font-size: 14px;
    color: #888;
    min-height: 17px;
}
   #releaseTracks {
    margin-top: 50px;
    text-align: left;
}

#releaseTracks h2 {
    font-size: 18px;
    margin-bottom: 25px;
    letter-spacing: 1px;
}
.release-track {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 12px;
    border-bottom: 1px solid #242424;
    cursor: pointer;
}

.release-track:hover {
    background: #090909;
}
.track-number {
    width: 25px;
    color: #888;
    flex-shrink: 0;
}

    .track-title {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 16px;
    }
        .track-play {
    margin-left: 0;
    flex-shrink: 0;
    width: 38px;
    height: 38px;
    border: 1px solid #242424;
    border-radius: 50%;
    background: #090909;
    color: #fff;
    cursor: pointer;
    font-size: 14px;
}

.track-play:hover {
    background: #242424;
}
.release-track > .fsb-song-actions {
    flex-shrink: 0;
    margin-left: 0;
}
@media (max-width: 600px) {
    .release-track {
        gap: 8px;
        padding: 13px 6px;
    }
    .track-number {
        width: 20px;
    }
    .track-play {
        width: 34px;
        height: 34px;
    }
}

<script>
    
const supabaseUrl = "https://ccvhvxugoebdqwxxankl.supabase.co";
const supabaseKey = "sb_publishable_vXhQFYGVd6hOHsX4i-ePnw_y687N16Z";

const supabaseClient = window.supabase.createClient(
    supabaseUrl,
    supabaseKey
);

const params = new URLSearchParams(window.location.search);
const releaseId = params.get("id");
console.log("Release ID from URL:", releaseId);
    
async function loadRelease() {
console.log("loadRelease() started");
    if (!releaseId) {
        document.getElementById("releaseTitle").textContent =
            "Release not found";

        document.getElementById("releaseArtwork").style.display =
            "none";

        document.getElementById("releaseInfo").style.display =
            "none";

        document.getElementById("releaseTracks").style.display =
            "none";

        return;
    }

const { data: release, error } = await supabaseClient
    .from("artist_releases")
    .select("*")
    .eq("id", releaseId.trim())
    .maybeSingle();

console.log("Supabase release data:", release);
console.log("Supabase release error:", error);
    if (error || !release) {

        console.error("Release error:", error);

        document.getElementById("releaseTitle").textContent =
            error
                ? "ERROR: " + error.message
                : "Release not found";

        document.getElementById("releaseType").textContent =
            "Release ID: " + releaseId;

        document.getElementById("releaseArtist").textContent =
            error?.details || error?.hint || "";

        return;
    }

document.getElementById("releaseTitle").textContent =
    release.title || release.name || release.release_title || "Untitled";
if(release.locked){const note=document.createElement("p");note.className="fsb-release-note";note.textContent=window.FSBRelease.label(release)+(release.early_tracks_available?" · Early-release tracks are playable now. Remaining tracks unlock at midnight Eastern.":" · Favorite tracks now. Playback unlocks worldwide at midnight Eastern.");document.getElementById("releaseTracks").before(note);}
document.title =
    (release.title || "Release") +
    " | Fly Since Birth";
document.getElementById("releaseType").textContent =
    (release.type || "RELEASE").toUpperCase();

  const { data: artist, error: artistError } = await supabaseClient
    .from("artists")
    .select("name")
    .eq("id", release.artist_id)
    .single();

if (artistError) {
    console.error("Artist error:", artistError);
}

document.getElementById("releaseArtist").textContent =
    artist?.name || release.artist_name || "";

if (release.release_date) {

    const date = new Date(release.release_at || release.release_date+"T12:00:00Z");

    document.getElementById("releaseDate").textContent =
        date.toLocaleDateString("en-US", {
            month: "long",
            day: "numeric",
            year: "numeric"
        });

} else {

    document.getElementById("releaseDate").textContent = "";

}

console.log("Release loaded:", release);
console.log("Artwork URL:", release.artwork_url);
console.log("Full release object:", JSON.stringify(release, null, 2));
console.log("Artwork URL value:", release.artwork_url);
if (release.artwork_url) {

    const image = document.getElementById("releaseImage");

    image.src = release.artwork_url;
    image.alt = release.title || "Release artwork";
    image.onload = function() {
    console.log("Artwork loaded successfully");
};

image.onerror = function() {
    console.error("Artwork FAILED to load:", release.artwork_url);
};

} else {

    const image = document.getElementById("releaseImage");

    image.src = "fsblogo.PNG";
    image.alt = "Fly Since Birth";

}
}

loadRelease();
    async function loadReleaseTracks() {
    if (!releaseId) {
        return;
    }
   const { data: tracks, error } = await supabaseClient
    .from("artist_songs")
    .select("*")
    .eq("release_id", releaseId.trim())
    .order("track_number", { ascending: true });

console.log("Release ID used for tracks:", releaseId);
console.log("Supabase tracks data:", tracks);
console.log("Supabase tracks error:", error);
    const trackList = document.getElementById("trackList");

if (error) {

    console.error("Tracks error:", error);

    trackList.innerHTML =
        "<p>ERROR: " + error.message + "</p>";

    return;
}

if (!tracks || tracks.length === 0) {

    trackList.innerHTML =
        "<p>No tracks found for this release.</p>";

    return;
}

    trackList.innerHTML = "";

    if (window.fsbMusicLibraryReady) {
        await window.fsbMusicLibraryReady;
    }

    const trackFeatureResult=tracks.length?await supabaseClient.from("artist_song_features").select("song_id,artist_id,sort_order").in("song_id",tracks.map(track=>track.id)).order("sort_order",{ascending:true}):{data:[],error:null};
    const trackFeatures=trackFeatureResult.error?[]:(trackFeatureResult.data||[]);
    const featureIdsBySong=new Map();
    trackFeatures.forEach(row=>{const key=String(row.song_id);if(!featureIdsBySong.has(key))featureIdsBySong.set(key,[]);featureIdsBySong.get(key).push(String(row.artist_id))});
    const creditArtistIds=[...new Set([...tracks.map(track=>track.artist_id),...trackFeatures.map(row=>row.artist_id)].filter(Boolean).map(String))];
    const creditArtistNames={};
    if(creditArtistIds.length){const artistsResult=await supabaseClient.from("artists").select("id,name").in("id",creditArtistIds);if(!artistsResult.error)(artistsResult.data||[]).forEach(artist=>creditArtistNames[String(artist.id)]=artist.name||"Artist")}
    window.FSBAlbum.setTracks(tracks);
    tracks.forEach((track, index) => {

        const trackRow = document.createElement("div");

        trackRow.className = "release-track";
        trackRow.dataset.albumSong=String(track.id);

        trackRow.innerHTML = '<span class="track-number"></span><span class="track-meta"><span class="track-title"></span><span class="track-credits"></span></span><button class="track-play" type="button">▶</button>';
        trackRow.querySelector(".track-number").textContent=track.track_number||index+1;
        trackRow.querySelector(".track-title").textContent=track.title||"";
        const credits=trackRow.querySelector(".track-credits");
        const ids=[...new Set([track.artist_id,...(featureIdsBySong.get(String(track.id))||[])].filter(Boolean).map(String))];
        ids.forEach((id,creditIndex)=>{const link=document.createElement("a");link.href="artist.html?id="+encodeURIComponent(id);link.textContent=creditArtistNames[id]||"Artist";if(creditIndex)credits.appendChild(document.createTextNode(creditIndex===1?" feat. ":", "));credits.appendChild(link);link.addEventListener("click",event=>event.stopPropagation())});
        let trackCreditCount=ids.length;
        (track.external_features||[]).forEach(credit=>{if(!credit||!credit.name||!credit.url)return;try{const url=new URL(credit.url);if(!["http:","https:"].includes(url.protocol))return;const link=document.createElement("a");link.href=url.href;link.target="_blank";link.rel="noopener noreferrer";link.textContent=credit.name;if(trackCreditCount)credits.appendChild(document.createTextNode(trackCreditCount===1?" feat. ":", "));credits.appendChild(link);link.addEventListener("click",event=>event.stopPropagation());trackCreditCount++}catch(_){}});
trackRow.onclick = function(event) {
 if(event.target.closest('a,.fsb-song-actions'))return;
 window.FSBAlbum.playSong(track);
};
const playButton=trackRow.querySelector(".track-play");
playButton.setAttribute("aria-label","Play "+track.title);
playButton.onclick=function(event){event.stopPropagation();window.FSBAlbum.playSong(track);};
        if (window.decorateSongControls) {
            window.decorateSongControls(trackRow, track);
        }
        trackList.appendChild(trackRow);

    });

}

loadReleaseTracks();
loadReleaseVideos();
    async function loadReleaseVideos() {

    if (!releaseId) {
        return;
    }

    const videoList =
        document.getElementById("releaseVideoList");

    const { data: videos, error } =
        await supabaseClient
            .from("videos")
            .select("*")
            .eq("release_id", releaseId.trim())
            .order("created_at", {
                ascending: false
            });

    console.log("Release videos:", videos);
    console.log("Release videos error:", error);

    if (error) {

        console.error(
            "Release videos error:",
            error
        );

        return;
    }

    if (!videos || videos.length === 0) {

        document.getElementById("releaseVideos").style.display =
            "none";

        return;
    }

    videoList.innerHTML = "";
    const videoFeatureResult=await supabaseClient.from("video_artist_features").select("video_id,artist_id,sort_order").in("video_id",videos.map(video=>video.id)).order("sort_order",{ascending:true});
    const videoFeatures=videoFeatureResult.error?[]:(videoFeatureResult.data||[]);
    const videoFeatureIds=new Map();videoFeatures.forEach(row=>{const key=String(row.video_id);if(!videoFeatureIds.has(key))videoFeatureIds.set(key,[]);videoFeatureIds.get(key).push(String(row.artist_id))});
    const videoCreditArtistIds=[...new Set([...videos.map(video=>video.artist_id),...videoFeatures.map(row=>row.artist_id)].filter(Boolean).map(String))],videoCreditNames={};
    if(videoCreditArtistIds.length){const artistResult=await supabaseClient.from("artists").select("id,name").in("id",videoCreditArtistIds);if(!artistResult.error)(artistResult.data||[]).forEach(artist=>videoCreditNames[String(artist.id)]=artist.name||"Artist")}

    videos.forEach(function(video) {

        const card =
            document.createElement("div");

        card.className =
            "release-video";

        if (video.image) {

            const image =
                document.createElement("img");

            image.src =
                video.image;

            image.alt =
                video.title ||
                "FSB Video";
 image.onerror = function() {
        console.error(
            "Thumbnail failed to load:",
            video.image
        );
    };
            
            card.appendChild(image);
        }

        if (video.title) {
            const title=document.createElement("div");
            title.className="release-video-title";
            title.textContent=video.title;
            card.appendChild(title);
        }
        const creditLine=document.createElement("div");creditLine.className="release-video-credits";creditLine.style.cssText="padding:0 12px 12px;font-size:13px;color:#bbb";
        const videoIds=[...new Set([video.artist_id,...(videoFeatureIds.get(String(video.id))||[])].filter(Boolean).map(String))];
        videoIds.forEach((id,index)=>{const link=document.createElement("a");link.href="artist.html?id="+encodeURIComponent(id);link.textContent=videoCreditNames[id]||"Artist";link.style.color="inherit";if(index)creditLine.appendChild(document.createTextNode(index===1?" feat. ":", "));creditLine.appendChild(link);link.addEventListener("click",event=>event.stopPropagation())});
        let videoCreditCount=videoIds.length;
        (video.external_features||[]).forEach(credit=>{if(!credit||!credit.name||!credit.url)return;try{const url=new URL(credit.url);if(!["http:","https:"].includes(url.protocol))return;const link=document.createElement("a");link.href=url.href;link.target="_blank";link.rel="noopener noreferrer";link.textContent=credit.name;link.style.color="inherit";if(videoCreditCount)creditLine.appendChild(document.createTextNode(videoCreditCount===1?" feat. ":", "));creditLine.appendChild(link);link.addEventListener("click",event=>event.stopPropagation());videoCreditCount++}catch(_){}});
        if(creditLine.childNodes.length)card.appendChild(creditLine);

        card.onclick = function() {
            window.location.href = "video.html?video_id=" + encodeURIComponent(video.id) + "&v=70a51fd5";
        };

        videoList.appendChild(card);

    });

}
  document.getElementById("releaseBackButton").onclick = function() {
    history.back();
};
    
</script>
