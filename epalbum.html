<!DOCTYPE html>
<html lang="en">
    <style>
    body {
        margin: 0;
        background: #000;
        color: #fff;
        font-family: Arial, sans-serif;
    }

    #releasePage {
        max-width: 900px;
        margin: 0 auto;
        padding: 60px 25px;
    }
#releaseBackButton {
    margin-bottom: 35px;
    padding: 10px 18px;
    border: 1px solid #242424;
    background: #090909;
    color: #fff;
    cursor: pointer;
}

#releaseBackButton:hover {
    background: #242424;
}
#releaseArtwork {
    display: flex;
    justify-content: center;
}

#releaseArtwork img {
    width: 400px;
    height: 400px;
    max-width: 100%;
    object-fit: cover;
    display: block;
    background: #111;
}
@media (max-width: 600px) {

    #releasePage {
        padding: 30px 15px;
    }

    #releaseArtwork img {
        width: 100%;
        max-width: 350px;
        height: auto;
        aspect-ratio: 1 / 1;
    }

    #releaseTitle {
        font-size: 30px;
    }

}

   #releaseInfo {
    margin-top: 25px;
    text-align: center;
}

#releaseTitle {
    margin: 0;
    font-size: 42px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
}

#releaseType,
#releaseArtist {
    margin: 8px 0 0;
    font-size: 16px;
}

#releaseType {
    font-weight: 600;
    letter-spacing: 2px;
}
#releaseDate {
    margin: 8px 0 0;
    font-size: 14px;
    color: #888;
    min-height: 17px;
}
   #releaseTracks {
    margin-top: 50px;
    text-align: left;
}

#releaseTracks h2 {
    font-size: 18px;
    margin-bottom: 25px;
    letter-spacing: 1px;
}
.release-track {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 16px 12px;
    border-bottom: 1px solid #242424;
}
.release-track {
    cursor: pointer;
}

.release-track:hover {
    background: #090909;
}
.track-number {
    width: 25px;
    color: #888;
    flex-shrink: 0;
}

    .track-title {
        font-size: 16px;
    }
        .track-play {
    margin-left: auto;
    width: 38px;
    height: 38px;
    border: 1px solid #242424;
    border-radius: 50%;
    background: #090909;
    color: #fff;
    cursor: pointer;
    font-size: 14px;
}

.track-play:hover {
    background: #242424;
}
</style>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Release | Fly Since Birth</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <div id="releasePage">
        
<button id="releaseBackButton" type="button">← BACK</button>
        
        <div id="releaseArtwork">
            <img id="releaseImage" src="" alt="">
        </div>

        <div id="releaseInfo">

            <h1 id="releaseTitle"></h1>

            <p id="releaseType"></p>

            <p id="releaseArtist"></p>
            
<p id="releaseDate"></p>
        </div>

        <div id="releaseTracks">

            <h2>TRACKLIST</h2>

            <div id="trackList"></div>

        </div>

    </div>
<script>
const supabaseUrl = "https://ccvhvxugoebdqwxxankl.supabase.co";
const supabaseKey = "sb_publishable_vXhQFYGVd6hOHsX4i-ePnw_y687N16Z&v=2";

const supabase = window.supabase.createClient(
    supabaseUrl,
    supabaseKey
);

const params = new URLSearchParams(window.location.search);
const releaseId = params.get("id");
console.log("Release ID from URL:", releaseId);
    
async function loadRelease() {
console.log("loadRelease() started");
    if (!releaseId) {
        document.getElementById("releaseTitle").textContent =
            "Release not found";

        document.getElementById("releaseArtwork").style.display =
            "none";

        document.getElementById("releaseInfo").style.display =
            "none";

        document.getElementById("releaseTracks").style.display =
            "none";

        return;
    }

const { data: release, error } = await supabase
    .from("artist_releases")
    .select("*")
    .eq("id", releaseId.trim())
    .maybeSingle();

console.log("Supabase release data:", release);
console.log("Supabase release error:", error);
    if (error || !release) {

        console.error("Release error:", error);

        document.getElementById("releaseTitle").textContent =
            error
                ? "ERROR: " + error.message
                : "Release not found";

        document.getElementById("releaseType").textContent =
            "Release ID: " + releaseId;

        document.getElementById("releaseArtist").textContent =
            error?.details || error?.hint || "";

        return;
    }

document.getElementById("releaseTitle").textContent =
    release.title || release.name || release.release_title || "Untitled";
document.title =
    (release.title || "Release") +
    " | Fly Since Birth";
document.getElementById("releaseType").textContent =
    (release.type || "RELEASE").toUpperCase();

   const { data: artist, error: artistError } = await supabase
    .from("artists")
    .select("name")
    .eq("id", release.artist_id)
    .single();

if (artistError) {
    console.error("Artist error:", artistError);
}

document.getElementById("releaseArtist").textContent =
    artist?.name || release.artist_name || "";

if (release.release_date) {

    const date = new Date(release.release_date);

    document.getElementById("releaseDate").textContent =
        date.toLocaleDateString("en-US", {
            month: "long",
            day: "numeric",
            year: "numeric"
        });

} else {

    document.getElementById("releaseDate").textContent = "";

}

console.log("Release loaded:", release);
console.log("Artwork URL:", release.artwork_url);
console.log("Full release object:", JSON.stringify(release, null, 2));
console.log("Artwork URL value:", release.artwork_url);
if (release.artwork_url) {

    const image = document.getElementById("releaseImage");

    image.src = release.artwork_url;
    image.alt = release.title || "Release artwork";
    image.onload = function() {
    console.log("Artwork loaded successfully");
};

image.onerror = function() {
    console.error("Artwork FAILED to load:", release.artwork_url);
};

} else {

    const image = document.getElementById("releaseImage");

    image.src = "fsblogo.PNG";
    image.alt = "Fly Since Birth";

}
}

loadRelease();
    async function loadReleaseTracks() {
    if (!releaseId) {
        return;
    }
   const { data: tracks, error } = await supabase
    .from("artist_songs")
    .select("*")
    .eq("release_id", releaseId.trim())
    .order("track_number", { ascending: true });

console.log("Release ID used for tracks:", releaseId);
console.log("Supabase tracks data:", tracks);
console.log("Supabase tracks error:", error);
    const trackList = document.getElementById("trackList");

if (error) {

    console.error("Tracks error:", error);

    trackList.innerHTML =
        "<p>ERROR: " + error.message + "</p>";

    return;
}

if (!tracks || tracks.length === 0) {

    trackList.innerHTML =
        "<p>No tracks found for this release.</p>";

    return;
}

    trackList.innerHTML = "";

    tracks.forEach((track, index) => {

        const trackRow = document.createElement("div");

        trackRow.className = "release-track";

        trackRow.innerHTML = `
   <span class="track-number">${track.track_number || index + 1}</span>
    <span class="track-title">${track.title || ""}</span>
    <button class="track-play" type="button">▶</button>
`;
trackRow.onclick = function() {

    if (!track.audio_url) {
        return;
    }

    if (window.releaseAudio) {
        window.releaseAudio.pause();
    }

    window.releaseAudio = new Audio(track.audio_url);

    window.releaseAudio.play().catch(function(error) {
        console.error("Audio playback failed:", error);
    });

};
        const playButton = trackRow.querySelector(".track-play");

playButton.onclick = function(event) {

    event.stopPropagation();

    if (!track.audio_url) {
        return;
    }

    if (window.releaseAudio) {
        window.releaseAudio.pause();
    }

    window.releaseAudio = new Audio(track.audio_url);

    window.releaseAudio.play().catch(function(error) {
        console.error("Audio playback failed:", error);
    });

};
        trackList.appendChild(trackRow);

    });

}

loadReleaseTracks();
  document.getElementById("releaseBackButton").onclick = function() {
    history.back();
};
    
</script>
    
</body>
</html>
