<!DOCTYPE html>
<html lang="en">
    <style>
    body {
        margin: 0;
        background: #000;
        color: #fff;
        font-family: Arial, sans-serif;
    }

    #releasePage {
        max-width: 900px;
        margin: 0 auto;
        padding: 60px 25px;
    }
#releaseBackButton {
    margin-bottom: 35px;
    padding: 10px 18px;
    border: 1px solid #242424;
    background: #090909;
    color: #fff;
    cursor: pointer;
}

#releaseBackButton:hover {
    background: #242424;
}
    #releaseArtwork img {
        width: 300px;
        height: 300px;
        object-fit: cover;
        display: block;
    }

    #releaseInfo {
        margin-top: 25px;
    }

    #releaseTitle {
        margin: 0;
        font-size: 42px;
    }

    #releaseType,
    #releaseArtist {
        margin: 8px 0 0;
        font-size: 16px;
    }

    #releaseTracks {
        margin-top: 50px;
    }

    #releaseTracks h2 {
        font-size: 18px;
        margin-bottom: 20px;
    }

    .release-track {
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 16px 0;
        border-bottom: 1px solid #242424;
    }

    .track-number {
        width: 25px;
        color: #888;
    }

    .track-title {
        font-size: 16px;
    }
        .track-play {
    margin-left: auto;
    width: 38px;
    height: 38px;
    border: 1px solid #242424;
    border-radius: 50%;
    background: #090909;
    color: #fff;
    cursor: pointer;
    font-size: 14px;
}

.track-play:hover {
    background: #242424;
}
</style>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Release | Fly Since Birth</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <div id="releasePage">
        
<button id="releaseBackButton" type="button">← BACK</button>
        
        <div id="releaseArtwork">
            <img id="releaseImage" src="" alt="">
        </div>

        <div id="releaseInfo">

            <h1 id="releaseTitle"></h1>

            <p id="releaseType"></p>

            <p id="releaseArtist"></p>

        </div>

        <div id="releaseTracks">

            <h2>TRACKLIST</h2>

            <div id="trackList"></div>

        </div>

    </div>
<script>
const supabaseUrl = "YOUR_SUPABASE_URL";
const supabaseKey = "YOUR_SUPABASE_ANON_KEY";

const supabase = window.supabase.createClient(
    supabaseUrl,
    supabaseKey
);

const params = new URLSearchParams(window.location.search);
const releaseId = params.get("id");

async function loadRelease() {

    if (!releaseId) {
        document.getElementById("releaseTitle").textContent =
            "Release not found";
        return;
    }

    const { data: release, error } = await supabase
        .from("artist_releases")
        .select("*")
        .eq("id", releaseId)
        .single();

    if (error || !release) {
        document.getElementById("releaseTitle").textContent =
            "Release not found";
        return;
    }

    document.getElementById("releaseTitle").textContent =
        release.title || "";

    document.getElementById("releaseType").textContent =
        (release.type || "").toUpperCase();

    document.getElementById("releaseArtist").textContent =
        release.artist_name || "";

    if (release.image_url) {
        const image = document.getElementById("releaseImage");

        image.src = release.image_url;
        image.alt = release.title || "Release artwork";
    }

}

loadRelease();
    async function loadReleaseTracks() {

    const { data: tracks, error } = await supabase
        .from("artist_songs")
        .select("*")
        .eq("release_id", releaseId)
        .order("track_number", { ascending: true });

    const trackList = document.getElementById("trackList");

    if (error || !tracks || tracks.length === 0) {
        trackList.innerHTML = "<p>No tracks found.</p>";
        return;
    }

    trackList.innerHTML = "";

    tracks.forEach((track, index) => {

        const trackRow = document.createElement("div");

        trackRow.className = "release-track";

        trackRow.innerHTML = `
    <span class="track-number">${index + 1}</span>
    <span class="track-title">${track.title || ""}</span>
    <button class="track-play" type="button">▶</button>
`;
trackRow.querySelector(".track-play").onclick = function() {

    if (track.audio_url) {
        const audio = new Audio(track.audio_url);
        audio.play();
    }

};
        trackList.appendChild(trackRow);

    });

}

loadReleaseTracks();
  document.getElementById("releaseBackButton").onclick = function() {
    history.back();
};
    
</script>
    
</body>
</html>
