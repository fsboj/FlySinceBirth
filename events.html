.events-list {

.event-detail-image { display: block; width: 100%; max-height: 380px; object-fit: contain; background: #111; margin: 0 0 22px; }
.event-detail-title { font-size: clamp(28px,5vw,48px); letter-spacing: -1.5px; margin: 6px 36px 12px 0; }
.event-detail-copy { color: #aaa; line-height: 1.6; margin: 9px 0; white-space: pre-wrap; }
.event-detail-actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:22px; }

.fsb-ticket-method { display:flex; align-items:center; gap:7px; color:#fff; font-size:13px; letter-spacing:0; }
.fsb-ticket-message { grid-column:1/-1; margin:0; }
.fsb-ticket-submit { justify-self:start; grid-column:1/-1; }
.event-empty {
    color: #666;
    font-size: 12px;
    padding: 16px 0;
}
@media (max-width: 650px) {
    .events-featured { grid-template-columns: 1fr; padding: 14px; gap: 18px; }

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SUPABASE_URL="https://ccvhvxugoebdqwxxankl.supabase.co";const SUPABASE_ANON_KEY="sb_publishable_vXhQFYGVd6hOHsX4i-ePnw_y687N16Z";const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
async function loadEvents() {
    const upcomingContainer = document.getElementById("events-list");
    const featuredContainer = document.getElementById("events-featured");
    if (!upcomingContainer || !featuredContainer) return;

    const { data, error } = await supabaseClient
        .from("events")
        .select("*")
        .order("sort_order", { ascending: true });

    if (error) {
        console.error("Could not load events:", error);
        upcomingContainer.innerHTML = '<div class="event-empty" role="status">EVENTS COULD NOT BE LOADED. <button type="button" class="event-action" id="retryEvents">TRY AGAIN</button></div>';
        document.getElementById("retryEvents").addEventListener("click", loadEvents);
        return;
    }

    featuredContainer.innerHTML = "";
    upcomingContainer.innerHTML = "";


    const allEvents = (data || []).map(function(event) {
        const parsedDate = event.date ? new Date(event.date) : null;
        const hasValidDate = parsedDate && !Number.isNaN(parsedDate.getTime());
        return Object.assign({}, event, {
            _parsedDate: hasValidDate ? parsedDate : null,
            _isPast: hasValidDate && parsedDate.getTime() < new Date().setHours(0,0,0,0)
        });
    });

    const upcoming = allEvents.filter(event => !event._isPast);

    upcoming.sort((a,b) => {
        if (a.featured && !b.featured) return -1;
        if (!a.featured && b.featured) return 1;
        if (a._parsedDate && b._parsedDate) return a._parsedDate - b._parsedDate;
        if (a._parsedDate) return -1;
        if (b._parsedDate) return 1;
        return (a.sort_order || 0) - (b.sort_order || 0);
    });

    function safeEventUrl(url) {
        try { const parsed = new URL(url); return parsed.protocol === "https:" || parsed.protocol === "http:" ? parsed.href : ""; }
        catch (_) { return ""; }
    }
    function makeLink(url, label) {
        url = safeEventUrl(url);
        if (!url) return null;
        const link = document.createElement("a");
        link.className = "event-action";
        link.href = url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = label;
        return link;
    }

    function showEventDetails(event) {
        const overlay = document.createElement("div");
        overlay.className = "event-detail-overlay";
        const dialog = document.createElement("section");
        dialog.className = "event-detail-dialog";
        dialog.setAttribute("role", "dialog");
        dialog.setAttribute("aria-modal", "true");
        dialog.setAttribute("aria-label", event.title || event.name || "Event details");
        let onKey;
        function closeDialog() { overlay.remove(); document.removeEventListener("keydown", onKey); }
        overlay.addEventListener("click", function(e) { if (e.target === overlay) closeDialog(); });
        const close = document.createElement("button");
        close.className = "event-detail-close"; close.type = "button"; close.setAttribute("aria-label", "Close event details"); close.textContent = "×";
        close.addEventListener("click", closeDialog);
        dialog.appendChild(close);
        if (event.image) { const image = document.createElement("img"); image.className = "event-detail-image"; image.src = event.image; image.alt = (event.title || "Event") + " flyer"; dialog.appendChild(image); }
        const date = document.createElement("div"); date.className = "page-kicker"; date.textContent = event.date || "EVENT DETAILS"; dialog.appendChild(date);
        const title = document.createElement("h2"); title.className = "event-detail-title"; title.textContent = event.title || event.name || "Event"; dialog.appendChild(title);
        [[event.location, ""], [event.performers, "Also performing: "], [event.contact_name, "Contact: "], [event.contact_email, "Email: "], [event.contact_phone, "Phone: "]].forEach(function(row) {
            if (!row[0]) return;
            const p = document.createElement("p"); p.className = "event-detail-copy"; p.textContent = row[1] + row[0]; dialog.appendChild(p);
        });
        const actions = document.createElement("div"); actions.className = "event-detail-actions";
        if (event.ticket_sales_mode === "on_site") {
            const ticketPanel = document.createElement("div"); ticketPanel.className = "fsb-ticket-host"; actions.appendChild(ticketPanel);
            window.FSBTicketing.mount(event, ticketPanel).catch(function(error) {
                ticketPanel.replaceChildren();
                const note = document.createElement("p"); note.className = "event-detail-copy";
                note.textContent = error.message || "Ticket availability could not be checked."; ticketPanel.appendChild(note);
            });
        } else {
            const ticketUrl = safeEventUrl(event.link);
            if (ticketUrl) { const ticket = document.createElement("a"); ticket.className = "event-action"; ticket.textContent = "BUY TICKETS / EVENT INFO"; ticket.href = ticketUrl; ticket.target = "_blank"; ticket.rel = "noopener noreferrer"; actions.appendChild(ticket); }
            else { const note = document.createElement("p"); note.className = "event-detail-copy"; note.textContent = "Ticket sales are not available for this event yet."; actions.appendChild(note); }
        }
        const videoUrl = safeEventUrl(event.video_link);
        if (videoUrl) { const video = document.createElement("a"); video.className = "event-action"; video.textContent = "WATCH EVENT VIDEOS"; video.href = videoUrl; video.target = "_blank"; video.rel = "noopener noreferrer"; actions.appendChild(video); }
        dialog.appendChild(actions); overlay.appendChild(dialog); document.body.appendChild(overlay);
        onKey = function(e) { if (e.key === "Escape") closeDialog(); };
        document.addEventListener("keydown", onKey); close.focus();
    }

    function makeEventCard(event, isFeatured) {
        const card = document.createElement("article");
        card.className = isFeatured ? "events-featured" : "event-card";

        if (event.image) {
            const img = document.createElement("img");
            img.className = isFeatured ? "events-featured-image" : "event-card-image";
            img.src = event.image;
            img.alt = (event.title || "Event") + " flyer";
            img.loading = "lazy";
            card.appendChild(img);
        }

        const details = document.createElement("div");
        if (isFeatured) {
            const badge = document.createElement("div");
            badge.className = "events-featured-label";
            badge.textContent = "FEATURED EVENT";
            details.appendChild(badge);
        }

        const date = document.createElement("div");
        date.className = "event-date";
        date.textContent = event.date || "";
        details.appendChild(date);

        const title = document.createElement("div");
        title.className = "event-title";
        title.textContent = event.title || event.name || "Event";
        title.classList.add("event-details-trigger");
        title.tabIndex = 0;
        title.setAttribute("role", "button");
        title.setAttribute("aria-label", "View details for " + title.textContent);
        title.addEventListener("click", function() { showEventDetails(event); });
        title.addEventListener("keydown", function(e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); showEventDetails(event); } });
        details.appendChild(title);

        const location = document.createElement("div");
        location.className = "event-location";
        location.textContent = event.location || "";
        if (event.location) details.appendChild(location);

        if (event.performers) {
            const performers = document.createElement("div");
            performers.className = "event-location";
            performers.textContent = "Also performing: " + event.performers;
            details.appendChild(performers);
        }

        const actions = document.createElement("div");
        actions.className = "event-actions";
        const detailsButton = document.createElement("button");
        detailsButton.className = "event-action";
        detailsButton.type = "button";
        detailsButton.textContent = event.ticket_sales_mode === "on_site" ? "BUY TICKETS" : "VIEW EVENT DETAILS";
        detailsButton.addEventListener("click", function() { showEventDetails(event); });
        actions.appendChild(detailsButton);
        const ticketLink = event.ticket_sales_mode === "on_site" ? null : makeLink(event.link, "BUY TICKETS / EVENT INFO");
        const videoLink = makeLink(event.video_link, "WATCH EVENT VIDEOS");
        if (ticketLink) actions.appendChild(ticketLink);
        if (videoLink) actions.appendChild(videoLink);
        if (actions.childElementCount) details.appendChild(actions);

        card.appendChild(details);
        return card;
    }

    const featured = upcoming.find(event => event.featured);
    if (featured) featuredContainer.appendChild(makeEventCard(featured, true));

    upcoming.forEach(function(event) {
        if (featured && String(event.id) === String(featured.id)) return;
        upcomingContainer.appendChild(makeEventCard(event, false));
    });


    if (!upcoming.length) upcomingContainer.innerHTML = '<p class="event-empty">NO UPCOMING EVENTS RIGHT NOW.</p>';
}

</script><script src="event-ticketing.js?v=2"></script><script>loadEvents();</script><script src="shared-nav.js?v=2"></script>
